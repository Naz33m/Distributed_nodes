version: "3.8"

services:
  coordinator:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    command: node coordinator.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  node1:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    command: node node.js 3001
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  node2:
    build: .
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    command: node node.js 3002
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  node3:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
    command: node node.js 3003
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 3
